  <script>
  (()=>{
    'use strict';const D=window.HAWKER_DATA,ADC=window.ADC_RUNWAY_DATA||{aerodromes:{},overrides:{}},KEY='ivplanner-hawker-v1',DEFAULTS_KEY='ivplanner-hawker-defaults-v1';if(!D?.runwayDatabase?.runways||!window.WMM2025){document.body.innerHTML='<main class="shell"><div class="notice">A base de pistas ou o modelo magnético WMM2025 não foi carregado. Confirme os arquivos do módulo Hawker e recarregue a página.</div></main>';return}
    const CUSTOM_AIRPORTS_KEY='ivplanner-custom-localities-v1';let customAirports=[];try{customAirports=JSON.parse(localStorage.getItem(CUSTOM_AIRPORTS_KEY)||'[]');if(!Array.isArray(customAirports))customAirports=[]}catch{customAirports=[]}const customAerodromes=customAirports.map(a=>[a.icao,a.name,a.lat,a.lon,a.elev,Math.max(0,...(a.runways||[]).map(r=>Number(r.length)||0)),a.uf||'']),adcAerodromes=Object.values(ADC.overrides||{}).map(x=>x.aerodrome).filter(Boolean),baseAerodromes=[...D.aerodromes,...adcAerodromes.filter(a=>!D.aerodromes.some(b=>b[0]===a[0]))],allAerodromes=[...baseAerodromes.filter(a=>!customAirports.some(c=>c.icao===a[0])),...customAerodromes];const byIcao=new Map(allAerodromes.map(a=>[a[0],{icao:a[0],name:a[1],lat:a[2],lon:a[3],elev:a[4],runway:a[5],uf:a[6]}]));const emptyWx=()=>({temp:'',pressureAlt:'',pressureSource:'',windDir:'',windSpeed:'',runway:'AUTO',flaps:'',surface:'',antiIce:false,metar:'',taf:''});const emptyLeg=()=>({from:'',to:'',type:'route',inspectionMinutes:0});const fresh=()=>({aircraft:'6050',fuel:0,payload:{pax:0,cargo:0},legs:Array.from({length:5},emptyLeg),legCount:1,alternate:'',weather:{adep:emptyWx(),adest:emptyWx(),altn:emptyWx()},page:'route'});const factoryDefaults=()=>({cruiseKt:D.constants.cruiseKt,firstHourLb:D.constants.firstHourLb,nextHoursLb:D.constants.nextHoursLb,inspectionLbHour:D.constants.inspectionLbHour,legExtraMinutes:10,roundMinutes:5,reserveLb:D.constants.reserveLb,aircraftPbo:{...D.aircraft},levels:[{max:10,fl:null},{max:19,fl:null},{max:29,fl:null},{max:44,fl:null},{max:59,fl:null},{max:9999,fl:null}]});
    let defaults=factoryDefaults();try{defaults=merge(factoryDefaults(),JSON.parse(localStorage.getItem(DEFAULTS_KEY)||'{}'))}catch{}let state=fresh();try{state=merge(fresh(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{}state.legs=Array.from({length:5},(_,i)=>({...emptyLeg(),...(state.legs[i]||{}),type:state.legs[i]?.type==='inspection'?'inspection':'route'}));const usedLegs=state.legs.reduce((last,leg,i)=>leg.from&&(leg.type==='inspection'?Number(leg.inspectionMinutes)>0:leg.to)?i+1:last,0);state.legCount=Math.min(5,Math.max(1,Number(state.legCount)||1,usedLegs));state.payload.pax=Math.min(5,Math.max(0,Math.floor(Number(state.payload.pax)||0)));state.payload.cargo=Math.max(0,Number(state.payload.cargo)||0);for(const role of ['adep','adest','altn'])state.weather[role]=merge(emptyWx(),state.weather[role]||{});
    function merge(base,add){if(!add||typeof add!=='object')return base;for(const k of Object.keys(add)){if(add[k]&&typeof add[k]==='object'&&!Array.isArray(add[k])&&base[k])merge(base[k],add[k]);else base[k]=add[k]}return base}const el=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const num=v=>Number.isFinite(Number(v))?Number(v):0,kg=v=>`${Math.round(num(v)).toLocaleString('pt-BR')} lb`,nm=v=>`${num(v).toFixed(0)} NM`,minText=m=>{m=Math.round(num(m));return `${Math.floor(m/60)}h${String(m%60).padStart(2,'0')}`},clamp=(v,a,b)=>Math.min(b,Math.max(a,v));function save(){localStorage.setItem(KEY,JSON.stringify(state));localStorage.setItem(DEFAULTS_KEY,JSON.stringify(defaults))}
    function distance(a,b){const r=Math.PI/180,p1=a.lat*r,p2=b.lat*r,dl=(b.lon-a.lon)*r;return 6371*Math.acos(clamp(Math.sin(p1)*Math.sin(p2)+Math.cos(p1)*Math.cos(p2)*Math.cos(dl),-1,1))/1.852}function burn(minutes){return minutes<=60?minutes/60*defaults.firstHourLb:defaults.firstHourLb+(minutes-60)/60*defaults.nextHoursLb}function flightLevel(minutes){if(!minutes)return'—';const level=defaults.levels.find(x=>minutes<=x.max)||defaults.levels.at(-1);return Number(level.fl)>0?`FL${String(Math.round(level.fl)).padStart(3,'0')}`:'—'}function legCalc(leg){const a=byIcao.get(leg.from);if(leg.type==='inspection'){const minutes=Math.max(0,num(leg.inspectionMinutes));if(!a||!minutes)return null;return{a,b:a,dist:0,minutes,burn:minutes/60*defaults.inspectionLbHour,fl:'—',type:'inspection'}}const b=byIcao.get(leg.to);if(!a||!b)return null;const dist=distance(a,b),baseMinutes=Math.floor(dist/defaults.cruiseKt*60),minutes=Math.ceil((baseMinutes+defaults.legExtraMinutes)/defaults.roundMinutes)*defaults.roundMinutes;return{a,b,dist,minutes,burn:burn(minutes),fl:flightLevel(minutes),type:'route'}}
    function model(){const legs=state.legs.map((leg,i)=>i<state.legCount?legCalc(leg):null),valid=legs.filter(Boolean),adep=valid[0]?.a||null,adest=valid.at(-1)?.b||null,alt=adest&&byIcao.get(state.alternate)?legCalc({from:adest.icao,to:state.alternate}):null,mainBurn=valid.reduce((s,l)=>s+l.burn,0),altBurn=alt?.burn||0,payload=num(state.payload.pax)*180+num(state.payload.cargo),pbo=defaults.aircraftPbo?.[state.aircraft]??D.aircraft[state.aircraft]??0,zfw=pbo+payload,minFuel=mainBurn+altBurn+defaults.reserveLb,maxFuel=Math.max(0,Math.min(D.limits.fuelCapacity,D.limits.mtow-zfw,D.limits.mlw-zfw+mainBurn)),fuel=num(state.fuel),tow=zfw+fuel,lw=tow-mainBurn,mainDistance=valid.reduce((s,l)=>s+l.dist,0),mainMinutes=valid.reduce((s,l)=>s+l.minutes,0);return{legs,valid,adep,adest,alt,mainBurn,altBurn,payload,pbo,zfw,minFuel,maxFuel,fuel,tow,lw,mainDistance,mainMinutes,totalDistance:mainDistance+(alt?.dist||0),totalMinutes:mainMinutes+(alt?.minutes||0)}}
    function airportInput(value,attrs=''){return`<input class="icao" list="aerodrome-list" maxlength="4" value="${esc(value)}" placeholder="ICAO" ${attrs}>`}function derived(l){return`<div class="derived"><div><span>Distância</span><strong class="${l?'':'empty'}">${l?nm(l.dist):'—'}</strong></div><div><span>TEV</span><strong class="${l?'':'empty'}">${l?minText(l.minutes):'—'}</strong></div><div><span>Consumo</span><strong class="${l?'':'empty'}">${l?kg(l.burn):'—'}</strong></div><div><span>Nível</span><strong class="${l?'':'empty'}">${l?l.fl:'—'}</strong></div></div>`}
    function renderRoute(m){const cards=state.legs.slice(0,state.legCount).map((leg,i)=>{const inspection=leg.type==='inspection',calc=m.legs[i],subtitle=inspection?(calc?`${esc(calc.a.name)} · ${minText(calc.minutes)}`:'Aeródromo · tempo de inspeção'):(calc?esc(calc.a.name)+' → '+esc(calc.b.name):`${defaults.cruiseKt} kt · +${defaults.legExtraMinutes} min`);return`<article class="card"><div class="leg-head"><span class="leg-number">TRECHO ${i+1}</span><span class="route-arrow">${subtitle}</span></div><div class="leg-type"><button data-leg-type="${i}" data-type="route" class="${inspection?'':'active'}">Rota</button><button data-leg-type="${i}" data-type="inspection" class="${inspection?'active':''}">Inspeção</button></div>${inspection?`<div class="fields inspection"><div class="field"><label>Aeródromo inspecionado</label>${airportInput(leg.from,`data-leg="${i}" data-side="from"`)}</div><div class="field"><label>Tempo de inspeção (min)</label><input type="number" inputmode="numeric" min="0" step="5" value="${esc(leg.inspectionMinutes)}" data-inspection-minutes="${i}"></div></div>`:`<div class="fields"><div class="field"><label>Origem</label>${airportInput(leg.from,`data-leg="${i}" data-side="from"`)}</div><b>→</b><div class="field"><label>Destino</label>${airportInput(leg.to,`data-leg="${i}" data-side="to"`)}</div></div>`}${derived(calc)}</article>`}).join(''),altFrom=m.adest?.icao||'';el('page-route').innerHTML=`<div class="section-title"><h2>Rota principal</h2><p>${state.legCount} de 5 trechos</p></div><div class="stack">${cards}</div><div class="route-actions">${state.legCount>1?'<button class="button secondary" id="remove-leg" aria-label="Remover último trecho">−</button>':''}${state.legCount<5?'<button class="button" id="add-leg" aria-label="Adicionar trecho">＋</button>':''}</div><div class="section-title"><h2>Alternativa</h2><p>Origem automática</p></div><article class="card blue"><div class="fields"><div class="field"><label>Origem</label><input class="icao" v       const sections=[rows('Rota e trechos',route),rows('Totais e combustível',[
        ['Distância / tempo destino',`${nm(m.mainDistance)} · ${minText(m.mainMinutes)}`],['Distância / tempo total',`${nm(m.totalDistance)} · ${minText(m.totalMinutes)}`],
        ['Consumo rota principal',kg(m.mainBurn)],['Consumo alternativa',kg(m.altBurn)],['Reserva',kg(REPORT_RESERVE)],REPORT_EXTRA,
        ['Combustível mínimo',kg(m.minFuel)],['Combustível planejado',kg(m.fuel)],['Máximo permitido',kg(m.maxFuel)]
      ]),rows('Pesos e carga',[
        ['PBO',kg(m.pbo)],...REPORT_PAYLOAD,['Payload total',kg(m.payload)],['ZFW',`${kg(m.zfw)} / limite ${kg(D.limits.mzfw)}`],
        ['TOW',`${kg(m.tow)} / limite ${kg(D.limits.mtow)}`],['LW no destino',`${kg(m.lw)} / limite ${kg(D.limits.mlw)}`],...REPORT_WEIGHT
      ])];
      for(const [role,label,airport,weight,kind] of [['adep','ADEP',m.adep,m.tow,'takeoff'],['adest','ADEST',m.adest,m.tow-m.mainBurn,'landing'],['altn','ALTN',m.alt?.b,m.tow-m.mainBurn-m.altBurn,'landing']]){
        if(!airport)continue;
        const wx=state.weather[role],runway=resolveRunway(airport,wx),component=runway?windComponent(wx.windDir,wx.windSpeed,runway.heading):null;
        const report=(()=>{const altitude=wx.pressureSource==='metar'&&wx.pressureAirport!==airport.icao?'':wx.pressureAlt,perf=kind==='takeoff'?takeoffPerf(altitude,wx.temp,weight,wx.flaps,wx.antiIce):landingPerf(altitude,weight,wx.surface),required=perf?.distanceFt*0.3048,available=runway?.length||airport.runway||0;return{rows:[['Altitude pressão',present(altitude)?`${altitude} ft`:'Não informada'],['Flapes / pista',kind==='takeoff'?`${fmt(wx.flaps)}° / seca`:`45° / ${wx.surface==='wet'?'molhada':wx.surface==='dry'?'seca':'não informada'}`],['Antigelo motores',kind==='takeoff'?(wx.antiIce?'Ligado':'Desligado'):'Não aplicável'],['Faixa da tabela',perf?`${kg(perf.weight)} · ${perf.alt} ft${kind==='takeoff'?` · ${perf.temp} °C`:''}`:'—']],perf,description:perf?`${Math.ceil(required)} m requeridos (${perf.distanceFt} ft)${available?` · diferença ${Math.floor(available-required)} m`:''} · ${kind==='takeoff'?`V1 ${perf.v1} / VR ${perf.vr} / V2 ${perf.v2}`:`VREF ${perf.vref}`} kt · tabela a vento zero`:''}})();
        sections.push(rows(`${label} • ${airport.icao} • meteorologia e performance`,[
          ['Aeródromo',`${airport.name} · elevação ${airport.elev} ft`],['Peso usado',kg(weight)],
          ['Cabeceira',runway?`${runway.id} · ${runwayHeadingText(runway)} · ${runway.length||airport.runway||0} m (${wx.runway==='AUTO'?'automática':'manual'})`:'Não disponível'],
          ['Temperatura',present(wx.temp)?`${wx.temp} °C`:'Não informada'],['Vento',present(wx.windDir)&&present(wx.windSpeed)?`${wx.windDir}° / ${wx.windSpeed} kt`:'Não informado'],
          ['Componente longitudinal',component===null?'Não calculada':`${Math.abs(component).toFixed(1)} kt ${component>=0?'PROA':'CAUDA'}`],
          ...report.rows,['Performance',report.perf?report.description:'Indisponível para os dados informados'],
          ['METAR completo',fmt(wx.metar)],['TAF completo',fmt(wx.taf)]
        ]));
      }
      sections.push(rows('Verificações',warnings(m).map(([,message],i)=>[`Aviso ${i+1}`,message])));
      return {aircraft:REPORT_AIRCRAFT,sections};
    }

    function render(){const m=model();renderRoute(m);renderWeight(m);renderPerformance(m);renderSummary(m);renderDefaults();applyFuelStyles(m);bind();showPage(state.page,false);save()}
    function bind(){document.querySelectorAll('[data-leg]').forEach(x=>x.addEventListener('change',()=>{const i=+x.dataset.leg,side=x.dataset.side;x.value=x.value.trim().toUpperCase();state.legs[i][side]=x.value;if(i<4){const next=state.legs[i+1],nextOrigin=state.legs[i].type==='inspection'?state.legs[i].from:state.legs[i].to;if(nextOrigin&&!next.from)next.from=nextOrigin}render()}));document.querySelectorAll('[data-leg-type]').forEach(x=>x.addEventListener('click',()=>{const i=+x.dataset.legType,leg=state.legs[i],wasDestination=leg.to;leg.type=x.dataset.type==='inspection'?'inspection':'route';if(leg.type==='inspection'){if(wasDestination&&i>0&&!leg.from)leg.from=wasDestination;leg.to=''}if(i<4&&!state.legs[i+1].from){const nextOrigin=leg.type==='inspection'?leg.from:leg.to;if(nextOrigin)state.legs[i+1].from=nextOrigin}render()}));document.querySelectorAll('[data-inspection-minutes]').forEach(x=>x.addEventListener('change',()=>{const i=+x.dataset.inspectionMinutes;state.legs[i].inspectionMinutes=Math.max(0,num(x.value));render()}));el('add-leg')?.addEventListener('click',()=>{if(state.legCount<5){const previous=state.legs[state.legCount-1],next=state.legs[state.legCount],nextOrigin=previous.type==='inspection'?previous.from:previous.to;if(nextOrigin&&!next.from)next.from=nextOrigin;state.legCount++;render()}});el('remove-leg')?.addEventListener('click',()=>{if(state.legCount>1){state.legs[state.legCount-1]=emptyLeg();state.legCount--;render()}});el('alternate')?.addEventListener('change',e=>{state.alternate=e.target.value.trim().toUpperCase();render()});document.querySelectorAll('[data-aircraft]').forEach(x=>x.addEventListener('click',()=>{state.aircraft=x.dataset.aircraft;render()}));document.querySelectorAll('[data-payload]').forEach(x=>x.addEventListener('change',()=>{const k=x.dataset.payload,max=x.max?+x.max:1e9;state.payload[k]=k==='pax'?Math.floor(clamp(num(x.value),0,max)):clamp(num(x.value),0,max);render()}));el('planned-fuel')?.addEventListener('change',e=>{state.fuel=clamp(num(e.target.value),0,D.limits.fuelCapacity);render()});el('use-min')?.addEventListener('click',()=>{state.fuel=Math.min(D.limits.fuelCapacity,Math.ceil(model().minFuel/10)*10);render()});document.querySelectorAll('[data-wx]').forEach(x=>x.addEventListener('change',()=>{const role=x.dataset.wx,field=x.dataset.wxfield;if(field==='pressureAlt')state.weather[role].pressureSource=x.value===''?'':'manual';state.weather[role][field]=field==='antiIce'?x.value==='on':field==='pressureAlt'?x.value===''?'':Number(x.value):field==='windDir'&&x.value!==''?clamp(num(x.value),0,360):field==='windSpeed'&&x.value!==''?Math.max(0,num(x.value)):x.value;render()}));document.querySelectorAll('[data-default]').forEach(x=>x.addEventListener('change',()=>{const min=Number(x.min),max=Number(x.max),value=clamp(num(x.value),min,max),key=x.dataset.default;if(key.startsWith('level-'))defaults.levels[Number(key.slice(6))].fl=x.value===''?null:Math.round(value);else if(key.startsWith('pbo-'))defaults.aircraftPbo[key.slice(4)]=Math.round(value);else defaults[key]=value;render()}));el('reset-defaults')?.addEventListener('click',()=>{if(confirm('Restaurar todos os parâmetros originais de planejamento?')){defaults=factoryDefaults();render()}});el('update-weather')?.addEventListener('click',updateWeather);el('export-flight-pdf')?.addEventListener('click',async()=>{const button=el('export-flight-pdf');button.disabled=true;try{await window.IVFlightReport.exportReport(flightReportData())}catch(error){console.error(error);alert('Não foi possível gerar o PDF neste dispositivo.')}finally{button.disabled=false}});el('reset-all')?.addEventListener('click',()=>{if(confirm('Limpar todos os dados deste planejamento?')){state=fresh();render()}})}
    function showPage(name,scroll=true){state.page=name;document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===`page-${name}`));document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.page===name));save();if(scroll)window.scrollTo({top:0,behavior:'smooth'})}document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>showPage(t.dataset.page)));el('aerodrome-list').innerHTML=allAerodromes.map(a=>`<option value="${a[0]}">${esc(a[1])} · ${a[6]||''}</option>`).join('');
    async function latestWx(icao,type){const response=await fetch(`https://api.met.no/weatherapi/tafmetar/1.0/${type}.txt?icao=${encodeURIComponent(icao)}`);if(!response.ok)return'';const lines=(await response.text()).split(/\r?\n/).map(x=>x.trim()).filter(Boolean);return type==='taf'?lines.join(' '):(lines.at(-1)||'')}async function updateWeather(){const m=model(),stations={adep:m.adep,adest:m.adest,altn:m.alt?.b},entries=Object.entries(stations).filter(([,a])=>a);if(!entries.length){alert('Defina a rota antes de atualizar a meteorologia.');return}const status=el('weather-status');status.textContent='Consultando METAR e TAF…';try{let received=0;await Promise.all(entries.map(async([role,a])=>{const[metar,taf]=await Promise.all([latestWx(a.icao,'metar').catch(()=>''),latestWx(a.icao,'taf').catch(()=>'')]);if(metar){const wx=state.weather[role];wx.metar=metar;received++;const temperature=metar.match(/\s(M?\d{2})\/(?:M?\d{2}|XX)\s/),wind=metar.match(/\b(\d{3}|VRB)(\d{2,3})(?:G\d{2,3})?KT\b/),qnh=metar.match(/\bQ(\d{4})\b/);if(temperature)wx.temp=(temperature[1][0]==='M'?-1:1)*Number(temperature[1].replace('M',''));if(wind){wx.windDir=wind[1]==='VRB'?'':Number(wind[1]);wx.windSpeed=Number(wind[2]);wx.runway='AUTO'}if(qnh&&wx.pressureSource!=='manual'){const pa=pressureAltitude(Number(a.elev),Number(qnh[1]));if(pa!==null){wx.pressureAlt=pa;wx.pressureSource='metar';wx.pressureAirport=a.icao}}}if(taf){state.weather[role].taf=taf;received++}}));if(!received)throw new Error('Nenhum boletim recebido');render();el('weather-status').textContent='Meteorologia atualizada. Confira o METAR e a altitude pressão antes do uso.'}catch(err){status.textContent='Não foi possível consultar agora. Use altitude pressão, temperatura e vento manuais; seus campos foram preservados.'}}

    ['gesturestart','gesturechange','gestureend'].forEach(type=>document.addEventListener(type,event=>event.preventDefault(),{passive:false}));
    render();
  })();
  </script>
