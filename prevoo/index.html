<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#17191b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Pré-voo · IV-PLANNER</title>
  <style>
    :root{color-scheme:dark;--bg:#17191b;--panel:#24272a;--line:#4d5359;--text:#f5f7f9;--muted:#aeb5bc;--blue:#078dd1;--blue2:#0aa4ef;--shadow:0 16px 35px rgba(0,0,0,.24)}
    *{box-sizing:border-box}body{margin:0;min-height:100svh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 100% 0,#44494d 0,transparent 30%),linear-gradient(155deg,#151719,#292c2f);color:var(--text)}
    main{width:min(760px,100%);min-height:100svh;margin:auto;padding:max(18px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom))}.topbar{display:flex;align-items:center;gap:14px;margin-bottom:34px}.back{display:grid;place-items:center;width:42px;height:42px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.05);color:#fff;text-decoration:none;font-size:1.7rem}.brand small{display:block;color:var(--blue2);font-size:.68rem;font-weight:800;letter-spacing:.16em}.brand strong{display:block;font-size:1.18rem;font-style:italic;letter-spacing:-.03em}.header{margin:0 2px 25px}.header h1{font-size:clamp(1.9rem,7vw,2.7rem);margin:0 0 7px}.header p{margin:0;color:var(--muted)}
    .grid{display:grid;gap:13px}.card{display:flex;align-items:center;gap:15px;min-height:104px;padding:17px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.035));box-shadow:var(--shadow);color:#fff;text-decoration:none;-webkit-tap-highlight-color:transparent;transition:transform .16s,border-color .16s}.card:active{transform:scale(.985)}.card.available{border-color:rgba(10,164,239,.55);background:linear-gradient(145deg,rgba(7,141,209,.19),rgba(255,255,255,.035))}.icon{width:54px;height:54px;flex:0 0 auto;display:grid;place-items:center;border:1px solid rgba(255,255,255,.12);border-radius:16px;background:#1c1f21;color:var(--blue2)}.icon svg{width:31px;height:31px}.copy{min-width:0;flex:1}.copy strong{display:block;font-size:1.08rem}.copy span{display:block;color:var(--muted);font-size:.78rem;margin-top:5px}.status{font-size:.65rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.available .status{color:var(--blue2)}.arrow{font-size:1.5rem;color:var(--blue2)}
    @media(min-width:600px){.grid{grid-template-columns:1fr 1fr}.card{min-height:145px;align-items:flex-start}.arrow{align-self:center}}
    html{background:var(--bg)}
  </style>
</head>
<body><main>
  <div class="topbar"><a class="back" href="../" aria-label="Voltar ao menu inicial">‹</a><div class="brand"><small>IV-PLANNER</small><strong>PRÉ-VOO</strong></div></div>
  <header class="header"><h1>Escolha a aeronave</h1><p>Planejamento, combustível e performance.</p></header>
  <nav class="grid" aria-label="Aeronaves">
    <a class="card available" href="legacy.html"><span class="icon" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><path d="M3 17l10-3 6-9 3 1-4 8 8 2 3-2 1 2-4 4-8-1 4 8-3 1-6-9-10-1z" fill="currentColor"/></svg></span><span class="copy"><strong>Legacy</strong><span>IU-50 · EMB-550</span></span><span class="status">Abrir</span><span class="arrow">›</span></a>
    <a class="card" href="hawker.html"><span class="icon" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><path d="M3 17l10-3 6-9 3 1-4 8 8 2 3-2 1 2-4 4-8-1 4 8-3 1-6-9-10-1z" fill="currentColor" opacity=".72"/></svg></span><span class="copy"><strong>Hawker</strong><span>Planejamento da aeronave</span></span><span class="status">Em breve</span><span class="arrow">›</span></a>
  </nav>
</main><script>['gesturestart','gesturechange','gestureend'].forEach(type=>document.addEventListener(type,event=>event.preventDefault(),{passive:false}));</script></body></html>
