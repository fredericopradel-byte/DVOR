<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17191b">
  <title>Legacy · IV-PLANNER</title>
  <style>
    :root{color-scheme:dark;--bg:#17191b;--panel:#24272a;--line:#4d5359;--text:#f5f7f9;--muted:#aeb5bc;--blue:#078dd1;--blue2:#0aa4ef;--red:#ff3448;--green:#39d98a;--amber:#ffb020;--shadow:0 16px 35px rgba(0,0,0,.24)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100svh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 100% 0,#44494d 0,transparent 30%),linear-gradient(155deg,#151719,#292c2f);color:var(--text);padding-bottom:calc(82px + env(safe-area-inset-bottom))}button,input,select{font:inherit}button{color:inherit}.shell{width:min(920px,100%);margin:auto;padding:max(18px,env(safe-area-inset-top)) 16px 30px}.topbar{display:flex;align-items:center;gap:14px;margin-bottom:22px}.back{display:grid;place-items:center;width:42px;height:42px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.05);color:#fff;text-decoration:none;font-size:1.7rem}.brand small{display:block;color:var(--blue2);font-size:.68rem;font-weight:800;letter-spacing:.16em}.brand strong{display:block;font-size:1.18rem;font-style:italic;letter-spacing:-.03em}.header{margin:12px 0 22px}.header h1{font-size:clamp(1.9rem,7vw,2.7rem);margin:0 0 6px}.header p{margin:0;color:var(--muted)}
    .page{display:none}.page.active{display:block}.section-title{display:flex;align-items:end;justify-content:space-between;gap:14px;margin:25px 2px 12px}.section-title h2{font-size:1.05rem;margin:0}.section-title p{margin:0;color:var(--muted);font-size:.78rem;text-align:right}.stack{display:grid;gap:12px}.grid2,.grid3{display:grid;gap:12px}.card{border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.035));box-shadow:var(--shadow);padding:16px}.card.blue{border-color:rgba(10,164,239,.55);background:linear-gradient(145deg,rgba(7,141,209,.19),rgba(255,255,255,.035))}.card.danger{border-color:rgba(255,52,72,.75)}
    .leg-head,.result-head,.metric{display:flex;align-items:center;justify-content:space-between;gap:10px}.leg-head{margin-bottom:13px}.leg-number{color:var(--blue2);font-size:.72rem;font-weight:900;letter-spacing:.13em}.route-arrow{color:var(--muted);font-size:.72rem;text-align:right}.fields{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:10px}.field label{display:block;color:var(--muted);font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin:0 0 6px}.field input,.field select{width:100%;height:46px;border:1px solid #596067;border-radius:13px;background:#191b1d;color:#fff;padding:0 12px;font-size:16px;outline:none}.field input:focus,.field select:focus{border-color:var(--blue2);box-shadow:0 0 0 3px rgba(10,164,239,.16)}.icao{text-transform:uppercase;font-weight:800;letter-spacing:.08em}.derived{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}.derived div,.mini{background:rgba(0,0,0,.18);border-radius:11px;padding:9px 7px;text-align:center}.derived span,.mini span{display:block;color:var(--muted);font-size:.6rem;text-transform:uppercase;letter-spacing:.06em}.derived strong,.mini strong{display:block;margin-top:3px;font-size:.83rem}.empty{color:#70777d!important}
    .segmented{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.segmented button{height:45px;border:1px solid var(--line);border-radius:12px;background:#1c1f21;font-weight:800}.segmented button.active{background:var(--blue);border-color:var(--blue2)}.pbo{margin:10px 2px 0;color:var(--muted);font-size:.8rem}.payload-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wide{grid-column:1/-1}.metric{padding:12px 0;border-bottom:1px solid rgba(255,255,255,.09)}.metric:last-child{border-bottom:0}.metric span{color:var(--muted);font-size:.83rem}.metric strong{font-variant-numeric:tabular-nums}.limitbar{height:7px;border-radius:10px;background:#111315;overflow:hidden;margin-top:8px}.limitbar i{display:block;height:100%;background:var(--blue2);border-radius:10px}.limitbar i.warn{background:var(--amber)}.limitbar i.danger{background:var(--red)}.status{font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.status.ok{color:var(--green)}.status.warn{color:var(--amber)}.status.danger{color:var(--red)}
    .button{display:inline-flex;align-items:center;justify-content:center;min-height:45px;padding:0 15px;border:0;border-radius:13px;background:var(--blue);color:#fff;font-weight:800}.button.secondary{background:#3c4146;border:1px solid #666d74}.button.small{min-height:38px;font-size:.82rem}.actions{display:flex;flex-wrap:wrap;gap:9px}.route-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:12px}.route-actions .button{min-width:48px;font-size:1.15rem}.notice{padding:13px 14px;border-left:3px solid var(--blue2);border-radius:10px;background:rgba(10,164,239,.08);color:var(--muted);font-size:.79rem;line-height:1.45}.weather-status{margin-top:10px;color:var(--muted);font-size:.76rem}.rawwx{margin:12px 0 0;padding:10px;border-radius:10px;background:#17191b;color:#cbd2d8;font:600 .72rem/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere}.perf-value{font-size:1.65rem;margin:5px 0 0}.perf-value small{font-size:.75rem;color:var(--muted)}.vspeeds{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.airport-meta{color:var(--muted);font-size:.76rem;margin:3px 0 13px}.margin{font-size:.76rem;margin-top:8px}.margin.ok{color:var(--green)}.margin.warn{color:var(--amber)}.margin.danger{color:var(--red)}
    .summary-route{font-size:1.05rem;font-weight:800;line-height:1.5}.summary-route b{color:var(--blue2)}.table-wrap{overflow:auto;border-radius:15px;border:1px solid var(--line)}table{width:100%;border-collapse:collapse;min-width:570px;background:rgba(0,0,0,.1)}th,td{padding:11px 10px;text-align:left;border-bottom:1px solid rgba(255,255,255,.08);font-size:.78rem}th{color:var(--muted);font-size:.65rem;text-transform:uppercase;letter-spacing:.07em}tr:last-child td{border-bottom:0}.warning-list{display:grid;gap:8px}.warning-item{border-radius:11px;padding:11px 12px;background:rgba(255,176,32,.1);color:#ffd994;font-size:.8rem}.warning-item.danger{background:rgba(255,52,72,.1);color:#ffadb6}.warning-item.ok{background:rgba(57,217,138,.1);color:#9ff1c7}
    .tabs{position:fixed;z-index:20;left:0;right:0;bottom:0;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:rgba(22,24,26,.94);backdrop-filter:blur(18px);border-top:1px solid rgba(255,255,255,.13)}.tabs nav{width:min(650px,100%);margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.tab{border:0;border-radius:11px;background:transparent;color:#929aa1;padding:8px 3px 7px;font-size:.66rem;font-weight:700}.tab i{display:block;width:8px;height:8px;border-radius:50%;background:#5c6369;margin:0 auto 5px}.tab.active{color:#fff;background:rgba(7,141,209,.18)}.tab.active i{background:var(--blue2);box-shadow:0 0 10px var(--blue2)}
    @media(min-width:650px){.grid2{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:repeat(3,1fr)}.payload-grid{grid-template-columns:repeat(3,1fr)}.wide{grid-column:auto}.shell{padding-left:24px;padding-right:24px}.tabs{bottom:14px;left:50%;right:auto;transform:translateX(-50%);width:min(620px,calc(100% - 28px));border:1px solid rgba(255,255,255,.13);border-radius:18px;padding:7px}.tabs nav{width:100%}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="topbar"><a class="back" href="./" aria-label="Voltar para Pré-voo">‹</a><div class="brand"><small>IV-PLANNER</small><strong>LEGACY</strong></div></div>
    <header class="header"><h1>Planejamento de voo</h1><p>Calculadora IU-50 adaptada para operação móvel.</p></header>
    <section class="page active" id="page-route"></section><section class="page" id="page-weight"></section><section class="page" id="page-performance"></section><section class="page" id="page-summary"></section>
  </main>
  <datalist id="aerodrome-list"></datalist>
  <footer class="tabs"><nav><button class="tab active" data-page="route"><i></i>Rota</button><button class="tab" data-page="weight"><i></i>Peso/Fuel</button><button class="tab" data-page="performance"><i></i>Performance</button><button class="tab" data-page="summary"><i></i>Resumo</button></nav></footer>
  <script src="legacy-data.js"></script>
  <script>
  (()=>{
    'use strict';const D=window.LEGACY_DATA,KEY='ivplanner-legacy-v1';if(!D){document.body.innerHTML='<main class="shell"><div class="notice">Não foi possível carregar legacy-data.js.</div></main>';return}
    const byIcao=new Map(D.aerodromes.map(a=>[a[0],{icao:a[0],name:a[1],lat:a[2],lon:a[3],elev:a[4],runway:a[5],uf:a[6]}]));const fresh=()=>({aircraft:'3604',fuel:0,payload:{fwd:0,aft:0,toilet:0,stowage:0,cargo:0},legs:Array.from({length:5},()=>({from:'',to:''})),legCount:1,alternate:'',weather:{adep:{temp:'',wind:'',metar:'',taf:''},adest:{temp:'',wind:'',metar:'',taf:''},altn:{temp:'',wind:'',metar:'',taf:''}},page:'route'});let state=fresh();try{state=merge(fresh(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{}const usedLegs=state.legs.reduce((last,leg,i)=>leg.from&&leg.to?i+1:last,0);state.legCount=Math.min(5,Math.max(1,Number(state.legCount)||1,usedLegs));
    function merge(base,add){if(!add||typeof add!=='object')return base;for(const k of Object.keys(add)){if(add[k]&&typeof add[k]==='object'&&!Array.isArray(add[k])&&base[k])merge(base[k],add[k]);else base[k]=add[k]}return base}const el=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const num=v=>Number.isFinite(Number(v))?Number(v):0,kg=v=>`${Math.round(num(v)).toLocaleString('pt-BR')} kg`,nm=v=>`${num(v).toFixed(0)} NM`,minText=m=>{m=Math.round(num(m));return `${Math.floor(m/60)}h${String(m%60).padStart(2,'0')}`},clamp=(v,a,b)=>Math.min(b,Math.max(a,v));function save(){localStorage.setItem(KEY,JSON.stringify(state))}
    function distance(a,b){const r=Math.PI/180,p1=a.lat*r,p2=b.lat*r,dl=(b.lon-a.lon)*r;return 6371*Math.acos(clamp(Math.sin(p1)*Math.sin(p2)+Math.cos(p1)*Math.cos(p2)*Math.cos(dl),-1,1))/1.852}function burn(minutes){return minutes<=60?minutes/60*1000:1000+(minutes-60)/60*750}function flightLevel(minutes){if(!minutes)return'—';if(minutes<=10)return'FL100';if(minutes<20)return'FL200';if(minutes<30)return'FL240';if(minutes<45)return'FL300';if(minutes<60)return'FL360';return'FL400'}function legCalc(leg){const a=byIcao.get(leg.from),b=byIcao.get(leg.to);if(!a||!b)return null;const dist=distance(a,b),baseMinutes=Math.floor(dist/D.constants.cruiseKt*60),minutes=Math.ceil((baseMinutes+10)/5)*5;return{a,b,dist,minutes,burn:burn(minutes),fl:flightLevel(minutes)}}
    function model(){const legs=state.legs.map((leg,i)=>i<state.legCount?legCalc(leg):null),valid=legs.filter(Boolean),adep=valid[0]?.a||null,adest=valid.at(-1)?.b||null,alt=adest&&byIcao.get(state.alternate)?legCalc({from:adest.icao,to:state.alternate}):null,mainBurn=valid.reduce((s,l)=>s+l.burn,0),altBurn=alt?.burn||0,payload=num(state.payload.fwd)*80+num(state.payload.aft)*80+num(state.payload.toilet)*80+num(state.payload.stowage)+num(state.payload.cargo),pbo=D.aircraft[state.aircraft]||0,zfw=pbo+payload,minFuel=mainBurn+altBurn+D.constants.reserveKg+D.constants.fixedExtraKg,maxFuel=Math.max(0,Math.min(D.limits.fuelCapacity,D.limits.mtow-zfw,D.limits.mlw-zfw+mainBurn)),fuel=num(state.fuel),tow=zfw+fuel,lw=tow-mainBurn;return{legs,valid,adep,adest,alt,mainBurn,altBurn,payload,pbo,zfw,minFuel,maxFuel,fuel,tow,lw,totalDistance:valid.reduce((s,l)=>s+l.dist,0)+(alt?.dist||0),totalMinutes:valid.reduce((s,l)=>s+l.minutes,0)+(alt?.minutes||0)}}
    function airportInput(value,attrs=''){return`<input class="icao" list="aerodrome-list" maxlength="4" value="${esc(value)}" placeholder="ICAO" ${attrs}>`}function derived(l){return`<div class="derived"><div><span>Distância</span><strong class="${l?'':'empty'}">${l?nm(l.dist):'—'}</strong></div><div><span>TEV</span><strong class="${l?'':'empty'}">${l?minText(l.minutes):'—'}</strong></div><div><span>Consumo</span><strong class="${l?'':'empty'}">${l?kg(l.burn):'—'}</strong></div><div><span>Nível</span><strong class="${l?'':'empty'}">${l?l.fl:'—'}</strong></div></div>`}
    function renderRoute(m){const cards=state.legs.slice(0,state.legCount).map((leg,i)=>`<article class="card"><div class="leg-head"><span class="leg-number">TRECHO ${i+1}</span><span class="route-arrow">${m.legs[i]?esc(m.legs[i].a.name)+' → '+esc(m.legs[i].b.name):'450 kt · +10 min'}</span></div><div class="fields"><div class="field"><label>Origem</label>${airportInput(leg.from,`data-leg="${i}" data-side="from"`)}</div><b>→</b><div class="field"><label>Destino</label>${airportInput(leg.to,`data-leg="${i}" data-side="to"`)}</div></div>${derived(m.legs[i])}</article>`).join(''),altFrom=m.adest?.icao||'';el('page-route').innerHTML=`<div class="section-title"><h2>Rota principal</h2><p>${state.legCount} de 5 trechos</p></div><div class="stack">${cards}</div><div class="route-actions">${state.legCount>1?'<button class="button secondary" id="remove-leg" aria-label="Remover último trecho">−</button>':''}${state.legCount<5?'<button class="button" id="add-leg" aria-label="Adicionar trecho">＋</button>':''}</div><div class="section-title"><h2>Alternativa</h2><p>Origem automática</p></div><article class="card blue"><div class="fields"><div class="field"><label>Origem</label><input class="icao" value="${esc(altFrom)}" disabled></div><b>→</b><div class="field"><label>Destino</label>${airportInput(state.alternate,'id="alternate"')}</div></div>${derived(m.alt)}</article>`}
    function field(label,key,value,extra=''){return`<div class="field"><label>${label}</label><input type="number" inputmode="numeric" value="${esc(value)}" data-payload="${key}" ${extra}></div>`}function limitMetric(label,value,limit){const pct=clamp(value/limit*100,0,100),margin=limit-value,cls=margin<0?'danger':margin<200?'warn':'';return`<div class="metric"><span>${label}<small style="display:block">Limite ${kg(limit)}</small></span><strong>${kg(value)}<small class="status ${cls||'ok'}" style="display:block;text-align:right">${margin>=0?kg(margin)+' disp.':kg(-margin)+' acima'}</small></strong></div><div class="limitbar"><i class="${cls}" style="width:${pct}%"></i></div>`}
    function renderWeight(m){el('page-weight').innerHTML=`<div class="section-title"><h2>Aeronave</h2><p>PBO da planilha IU-50</p></div><article class="card"><div class="segmented">${Object.keys(D.aircraft).map(n=>`<button data-aircraft="${n}" class="${state.aircraft===n?'active':''}">${n}</button>`).join('')}</div><p class="pbo">Peso Básico Operacional: <strong>${kg(m.pbo)}</strong></p></article><div class="section-title"><h2>Carga paga</h2><p>80 kg por ocupante</p></div><article class="card"><div class="payload-grid">${field('Cabine FWD (0–4)','fwd',state.payload.fwd,'min="0" max="4" step="1"')}${field('Cabine AFT (0–2)','aft',state.payload.aft,'min="0" max="2" step="1"')}${field('Toilet (0–1)','toilet',state.payload.toilet,'min="0" max="1" step="1"')}${field('Stowage (kg)','stowage',state.payload.stowage,'min="0"')}${field('Cargo (kg)','cargo',state.payload.cargo,'min="0"')}<div class="mini"><span>Payload total</span><strong>${kg(m.payload)}</strong></div></div></article><div class="section-title"><h2>Combustível</h2><p>Capacidade ${kg(D.limits.fuelCapacity)}</p></div><article class="card blue"><div class="field"><label>Combustível planejado (kg)</label><input id="planned-fuel" type="number" inputmode="numeric" min="0" max="5962" step="10" value="${esc(state.fuel)}"></div><div class="actions" style="margin-top:10px"><button class="button small" id="use-min">Usar mínimo ${kg(m.minFuel)}</button></div><div class="metric"><span>Mínimo calculado</span><strong>${kg(m.minFuel)}</strong></div><div class="metric"><span>Máximo permitido</span><strong>${kg(m.maxFuel)}</strong></div></article><div class="section-title"><h2>Limites de peso</h2><p>Estimativa operacional</p></div><article class="card">${limitMetric('TOW',m.tow,D.limits.mtow)}${limitMetric('LW no destino final',m.lw,D.limits.mlw)}${limitMetric('ZFW',m.zfw,D.limits.mzfw)}</article><div class="notice" style="margin-top:12px">Os resultados reproduzem a lógica da planilha e não substituem documentação aprovada, despacho ou conferência da tripulação.</div>`}
    function nearestHigher(list,value){return list.find(x=>x>=value)??list.at(-1)}function takeoffPerf(elev,temp,weight){const rows=D.takeoff.slice(1),weights=D.takeoff[0].filter((x,i)=>i>=2&&i%4===2&&typeof x==='number'),w=nearestHigher(weights,weight),alt=clamp(Math.round(elev/1000)*1000,0,4000),same=rows.filter(r=>r[0]===alt),chosen=same.reduce((a,r)=>!a||Math.abs(r[1]-temp)<Math.abs(a[1]-temp)?r:a,null),idx=D.takeoff[0].indexOf(w);return chosen?{alt,temp:chosen[1],weight:w,distance:chosen[idx],v1:chosen[idx+1],vr:chosen[idx+2],v2:chosen[idx+3]}:null}function landingPerf(elev,wind,weight){const rows=D.landing.slice(1),weights=[10600,11200,11800,12400,13000,13600,14200,14800,15400,16000,16600,17400],winds=[-10,0,10,20],w=nearestHigher(weights,weight),alt=clamp(Math.round(elev/1000)*1000,-1000,6000),ws=winds.reduce((a,x)=>Math.abs(x-wind)<Math.abs(a-wind)?x:a),row=rows.find(r=>r[0]===alt&&r[1]===w);return row?{alt,weight:w,wind:ws,distance:row[2+winds.indexOf(ws)]}:null}function marginClass(v){return v<0?'danger':v<300?'warn':'ok'}
    function wxCard(role,title,airport,weight,kind){const wx=state.weather[role],to=airport?takeoffPerf(airport.elev,num(wx.temp),weight):null,ld=airport?landingPerf(airport.elev,num(wx.wind),weight):null,perf=kind==='takeoff'?to:ld,margin=airport&&perf?airport.runway-perf.distance:null;return`<article class="card ${margin!==null&&margin<0?'danger':''}"><div class="result-head"><div><span class="leg-number">${title}</span><h3 style="margin:4px 0 0">${airport?airport.icao:'—'}</h3></div><strong>${weight?kg(weight):'—'}</strong></div><p class="airport-meta">${airport?`${esc(airport.name)} · ${airport.elev} ft · pista ${airport.runway} m`:'Defina a rota para calcular.'}</p><div class="grid2"><div class="field"><label>Temperatura °C</label><input type="number" inputmode="decimal" data-wx="${role}" data-wxfield="temp" value="${esc(wx.temp)}"></div><div class="field"><label>Vento de proa kt</label><input type="number" inputmode="decimal" data-wx="${role}" data-wxfield="wind" value="${esc(wx.wind)}"></div></div>${airport&&perf?`<div class="section-title" style="margin-top:16px"><h2>${kind==='takeoff'?'Decolagem':'Pouso'}</h2><p>Correção conservadora</p></div><div class="perf-value">${Math.round(perf.distance)} <small>m requeridos</small></div>${kind==='takeoff'?`<div class="vspeeds"><div class="mini"><span>V1</span><strong>${perf.v1} kt</strong></div><div class="mini"><span>VR</span><strong>${perf.vr} kt</strong></div><div class="mini"><span>V2</span><strong>${perf.v2} kt</strong></div></div>`:''}<div class="margin ${marginClass(margin)}">Margem de pista: ${margin>=0?'+':''}${Math.round(margin)} m</div>`:''}${wx.metar?`<p class="rawwx">${esc(wx.metar)}</p>`:''}${wx.taf?`<p class="rawwx">${esc(wx.taf)}</p>`:''}</article>`}
    function renderPerformance(m){const altn=m.alt?.b||null;el('page-performance').innerHTML=`<div class="section-title"><h2>Condições</h2><p>ICE PROTECTION OFF</p></div><div class="actions"><button class="button" id="update-weather">Atualizar METAR/TAF</button></div><p class="weather-status" id="weather-status">A consulta online preenche temperatura e vento; os campos permanecem editáveis.</p><div class="section-title"><h2>Resultados</h2><p>Arredondamento conservador</p></div><div class="grid3">${wxCard('adep','ADEP',m.adep,m.tow,'takeoff')}${wxCard('adest','ADEST',m.adest,m.tow-m.mainBurn,'landing')}${wxCard('altn','ALTN',altn,m.tow-m.mainBurn-m.altBurn,'landing')}</div><div class="notice" style="margin-top:12px">Altitude e temperatura são ajustadas à faixa mais próxima disponível; peso usa a faixa imediatamente superior. Para pouso, o vento é ajustado para −10, 0, 10 ou 20 kt.</div>`}
    function warnings(m){const w=[];if(!m.valid.length)w.push(['warn','Defina ao menos um trecho válido.']);if(!m.fuel)w.push(['warn','Informe o combustível planejado.']);else{if(m.fuel<m.minFuel)w.push(['danger',`Combustível ${kg(m.minFuel-m.fuel)} abaixo do mínimo.`]);if(m.fuel>m.maxFuel)w.push(['danger',`Combustível ${kg(m.fuel-m.maxFuel)} acima do máximo permitido.`])}if(m.tow>D.limits.mtow)w.push(['danger',`TOW excede o MTOW em ${kg(m.tow-D.limits.mtow)}.`]);if(m.lw>D.limits.mlw)w.push(['danger',`LW excede o MLW em ${kg(m.lw-D.limits.mlw)}.`]);if(m.zfw>D.limits.mzfw)w.push(['danger',`ZFW excede o MZFW em ${kg(m.zfw-D.limits.mzfw)}.`]);if(!w.length)w.push(['ok','Valores calculados dentro dos limites cadastrados.']);return w}
    function renderSummary(m){const route=m.valid.length?[m.valid[0].a.icao,...m.valid.map(l=>l.b.icao)].join(' → '):'Rota não definida',rows=m.legs.map((l,i)=>l?`<tr><td>${i+1}</td><td>${l.a.icao} → ${l.b.icao}</td><td>${nm(l.dist)}</td><td>${minText(l.minutes)}</td><td>${kg(l.burn)}</td><td>${l.fl}</td></tr>`:'').join('')+(m.alt?`<tr><td>ALT</td><td>${m.alt.a.icao} → ${m.alt.b.icao}</td><td>${nm(m.alt.dist)}</td><td>${minText(m.alt.minutes)}</td><td>${kg(m.alt.burn)}</td><td>${m.alt.fl}</td></tr>`:'');el('page-summary').innerHTML=`<div class="section-title"><h2>Plano consolidado</h2><p>Legacy ${state.aircraft}</p></div><article class="card blue"><div class="summary-route">${route}${m.alt?` <b>· ALT ${m.alt.b.icao}</b>`:''}</div><div class="derived"><div><span>Distância total</span><strong>${nm(m.totalDistance)}</strong></div><div><span>Tempo total</span><strong>${minText(m.totalMinutes)}</strong></div><div><span>Fuel mínimo</span><strong>${kg(m.minFuel)}</strong></div><div><span>Fuel planejado</span><strong>${kg(m.fuel)}</strong></div></div></article><div class="section-title"><h2>Pesos</h2><p>PBO ${kg(m.pbo)}</p></div><div class="grid3"><article class="card"><span class="leg-number">TOW</span><div class="perf-value">${kg(m.tow)}</div><p class="airport-meta">MTOW ${kg(D.limits.mtow)}</p></article><article class="card"><span class="leg-number">LW</span><div class="perf-value">${kg(m.lw)}</div><p class="airport-meta">MLW ${kg(D.limits.mlw)}</p></article><article class="card"><span class="leg-number">ZFW</span><div class="perf-value">${kg(m.zfw)}</div><p class="airport-meta">MZFW ${kg(D.limits.mzfw)}</p></article></div><div class="section-title"><h2>Trechos</h2><p>Consumo estimado</p></div><div class="table-wrap"><table><thead><tr><th>#</th><th>Rota</th><th>Dist.</th><th>TEV</th><th>Fuel</th><th>FL</th></tr></thead><tbody>${rows||'<tr><td colspan="6">Nenhum trecho válido.</td></tr>'}</tbody></table></div><div class="section-title"><h2>Verificações</h2><p>Antes do voo</p></div><div class="warning-list">${warnings(m).map(([c,t])=>`<div class="warning-item ${c}">${t}</div>`).join('')}</div><div class="actions" style="margin-top:14px"><button class="button secondary" id="reset-all">Limpar planejamento</button></div>`}
    function render(){const m=model();renderRoute(m);renderWeight(m);renderPerformance(m);renderSummary(m);bind();showPage(state.page,false);save()}
    function bind(){document.querySelectorAll('[data-leg]').forEach(x=>x.addEventListener('change',()=>{const i=+x.dataset.leg,side=x.dataset.side;x.value=x.value.trim().toUpperCase();state.legs[i][side]=x.value;if(side==='to'&&i<4&&!state.legs[i+1].from)state.legs[i+1].from=x.value;render()}));el('add-leg')?.addEventListener('click',()=>{if(state.legCount<5){state.legCount++;render()}});el('remove-leg')?.addEventListener('click',()=>{if(state.legCount>1){state.legs[state.legCount-1]={from:'',to:''};state.legCount--;render()}});el('alternate')?.addEventListener('change',e=>{state.alternate=e.target.value.trim().toUpperCase();render()});document.querySelectorAll('[data-aircraft]').forEach(x=>x.addEventListener('click',()=>{state.aircraft=x.dataset.aircraft;render()}));document.querySelectorAll('[data-payload]').forEach(x=>x.addEventListener('change',()=>{const k=x.dataset.payload,max=x.max?+x.max:1e9;state.payload[k]=clamp(num(x.value),0,max);render()}));el('planned-fuel')?.addEventListener('change',e=>{state.fuel=clamp(num(e.target.value),0,D.limits.fuelCapacity);render()});el('use-min')?.addEventListener('click',()=>{state.fuel=Math.min(D.limits.fuelCapacity,Math.ceil(model().minFuel/10)*10);render()});document.querySelectorAll('[data-wx]').forEach(x=>x.addEventListener('change',()=>{state.weather[x.dataset.wx][x.dataset.wxfield]=x.value;render()}));el('update-weather')?.addEventListener('click',updateWeather);el('reset-all')?.addEventListener('click',()=>{if(confirm('Limpar todos os dados deste planejamento?')){state=fresh();render()}})}
    function showPage(name,scroll=true){state.page=name;document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===`page-${name}`));document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.page===name));save();if(scroll)window.scrollTo({top:0,behavior:'smooth'})}document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>showPage(t.dataset.page)));el('aerodrome-list').innerHTML=D.aerodromes.map(a=>`<option value="${a[0]}">${esc(a[1])} · ${a[6]||''}</option>`).join('');
    async function latestWx(icao,type){const response=await fetch(`https://api.met.no/weatherapi/tafmetar/1.0/${type}.txt?icao=${encodeURIComponent(icao)}`);if(!response.ok)return'';const lines=(await response.text()).split(/\r?\n/).map(x=>x.trim()).filter(Boolean);return lines.at(-1)||''}async function updateWeather(){const m=model(),stations={adep:m.adep?.icao,adest:m.adest?.icao,altn:m.alt?.b?.icao},entries=Object.entries(stations).filter(([,id])=>id);if(!entries.length){alert('Defina a rota antes de atualizar a meteorologia.');return}const status=el('weather-status');status.textContent='Consultando METAR e TAF…';try{let received=0;await Promise.all(entries.map(async([role,id])=>{const[metar,taf]=await Promise.all([latestWx(id,'metar').catch(()=>''),latestWx(id,'taf').catch(()=>'')]);if(metar){state.weather[role].metar=metar;received++;const temperature=metar.match(/\s(M?\d{2})\/(?:M?\d{2}|XX)\s/),wind=metar.match(/\b(?:\d{3}|VRB)(\d{2,3})(?:G\d{2,3})?KT\b/);if(temperature)state.weather[role].temp=(temperature[1][0]==='M'?-1:1)*Number(temperature[1].replace('M',''));if(wind)state.weather[role].wind=Number(wind[1])}if(taf){state.weather[role].taf=taf;received++}}));if(!received)throw new Error('Nenhum boletim recebido');render();el('weather-status').textContent='Meteorologia atualizada. Confira os boletins e valores antes de usar.'}catch(err){status.textContent='Não foi possível consultar agora. Verifique a conexão ou use temperatura e vento manualmente.'}}
    render();
  })();
  </script>
</body>
