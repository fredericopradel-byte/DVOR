    function wxCard(role,title,airport,weight,kind){const wx=state.weather[role],ends=airport?runwayEnds(airport.icao):[],selected=airport?resolveRunway(airport,wx):null,selectedValue=ends.some(r=>r.id===wx.runway)?wx.runway:'AUTO',component=selected?windComponent(wx.windDir,wx.windSpeed,selected.heading):null,flap=kind==='takeoff'?(wx.flap==='1'?'1':'2'):(wx.flap==='3'?'3':'FULL'),ice=wx.iceProtection==='ALL'?'ALL':'OFF',to=airport?takeoffPerf(airport.elev,num(wx.temp),weight,flap,ice):null,ld=airport?landingPerf(airport.elev,component??0,weight,flap,ice,wx.runwaySurface):null,perf=kind==='takeoff'?to:ld,runwayLength=selected?.length||airport?.runway||0,margin=airport&&perf?runwayLength-perf.distance:null,componentText=component===null?'Informe direção e velocidade':component>=0?`${component.toFixed(1)} kt PROA`:`${Math.abs(component).toFixed(1)} kt CAUDA`;return`<article class="card ${margin!==null&&margin<0?'danger':''}"><div class="result-head"><div><span class="leg-number">${title}</span><h3 style="margin:4px 0 0">${airport?airport.icao:'—'}</h3></div><strong>${weight?kg(weight):'—'}</strong></div><p class="airport-meta">${airport?`${esc(airport.name)} · ${airport.elev} ft${selected?` · cabeceira ${esc(selected.id)} · ${runwayHeadingText(selected)} · ${runwayLength} m`:''}`:'Defina a rota para calcular.'}</p><div class="wx-fields"><div class="field"><label>Temperatura °C</label><input type="number" inputmode="decimal" data-wx="${role}" data-wxfield="temp" value="${esc(wx.temp)}"></div><div class="field"><label>Direção do vento °</label><input type="number" inputmode="numeric" min="0" max="360" data-wx="${role}" data-wxfield="windDir" value="${esc(wx.windDir)}"></div><div class="field"><label>Intensidade do vento kt</label><input type="number" inputmode="decimal" min="0" data-wx="${role}" data-wxfield="windSpeed" value="${esc(wx.windSpeed)}"></div><div class="field runway-field"><label>Cabeceira em uso</label><select data-wx="${role}" data-wxfield="runway"><opti     function renderPerformance(m){const altn=m.alt?.b||null;el('page-performance').innerHTML=`<div class="section-title"><h2>Condições</h2><p>Flap e ice protection por aeródromo</p></div><div class="actions"><button class="button" id="update-weather">Atualizar METAR/TAF</button></div><p class="weather-status" id="weather-status">A consulta online preenche temperatura, direção e intensidade do vento; os campos permanecem editáveis.</p><div class="section-title"><h2>Resultados</h2><p>Arredondamento conservador</p></div><div class="grid3">${wxCard('adep','ADEP',m.adep,m.tow,'takeoff')}${wxCard('adest','ADEST',m.adest,m.tow-m.mainBurn,'landing')}${wxCard('altn','ALTN',altn,m.tow-m.mainBurn-m.altBurn,'landing')}</div><div class="notice" style="margin-top:12px">A cabeceira automática sugere a maior componente de proa e pode ser alterada pelo piloto. O vento do METAR é comparado internamente com rumo verdadeiro. A prioridade é: BRG MAG da ADC vigente; geometria das cabeceiras; e, na ausência de ambos, rumo magnético nominal obtido do número da cabeceira. A conversão magnético/verdadeiro usa o WMM2025 incorporado ao app e funciona offline. Um rumo publicado nunca é sobrescrito pelo modelo magnético. Rumos nominais são identificados como estimados e podem diferir do eixo real em aproximadamente 5° ou mais se houver renumeração pendente. Altitude e temperatura são ajustadas à faixa mais próxima disponível; peso usa a faixa imediatamente superior. As seleções de flap e ice protection são independentes para ADEP, ADEST e ALTN. As tabelas simplificadas do AFM abrangem decolagem flap 2, pista seca, ice protection OFF/ALL e pouso flap 3/FULL, pista seca, ice protection OFF/ALL. A decolagem usa pista seca; flap 1 utiliza as tabelas do QRH. No pouso molhado, a distância sem fator de pista seca é multiplicada pelo fator 1,25 publicado no AFM (não se aplica à decolagem). Para a tabela de pouso, a componente calculada é ajustada para −10, 0, 10 ou 20 kt. Confirme os dados em publicação     function renderSummary(m){const route=m.valid.length?m.valid.map((l,i)=>l.type==='inspection'?`${i?'':'INSPEÇÃO '}${l.a.icao} (INSPEÇÃO)`:i?l.b.icao:`${l.a.icao} → ${l.b.icao}`).join(' → '):'Rota não definida',rows=m.legs.map((l,i)=>l?`<tr><td>${i+1}</td><td>${l.type==='inspection'?`INSPEÇÃO ${l.a.icao}`:`${l.a.icao} → ${l.b.icao}`}</td><td>${l.type==='inspection'?'—':nm(l.dist)}</td><td>${minText(l.minutes)}</td><td>${kg(l.burn)}</td><td>${l.fl}</td></tr>`:'').join('')+(m.alt?`<tr><td>ALT</td><td>${m.alt.a.icao} → ${m.alt.b.icao}</td><td>${nm(m.alt.dist)}</td><td>${minText(m.alt.minutes)}</td><td>${kg(m.alt.burn)}</td><td>${m.alt.fl}</td></tr>`:'');el('page-summary').innerHTML=`<div class="section-title"><h2>Plano consolidado</h2><p>Legacy ${state.aircraft}</p></div><article class="card blue"><div class="summary-route">${route}${m.alt?` <b>· ALT ${m.alt.b.icao}</b>`:''}</div><div class="derived summary-metrics"><div><span>Distância ao destino</span><strong>${nm(m.mainDistance)}</strong></div><div><span>Tempo ao destino</span><strong>${minText(m.mainMinutes)}</strong></div><div><span>Distância destino–alternativa</span><strong class="${m.alt?'':'empty'}">${m.alt?nm(m.alt.dist):'—'}</strong></div><div><span>Tempo destino–alternativa</span><strong class="${m.alt?'':'empty'}">${m.alt?minText(m.alt.minutes):'—'}</strong></div><div><span>Fuel mínimo</span><strong>${kg(m.minFuel)}</strong></div><div><span>Fuel planejado</span><strong>${kg(m.fuel)}</strong></div></div></article><div class="section-title"><h2>Pesos</h2><p>PBO ${kg(m.pbo)}</p></div><div class="grid3"><article class="card"><span class="leg-number">TOW</span><div class="perf-value">${kg(m.tow)}</div><p class="airport-meta">MTOW ${kg(D.limits.mtow)}</p></article><article class="card"><span class="leg-number">LW</span><div class="perf-value">${kg(m.lw)}</div><p class="airport-meta">MLW ${kg(D.limits.mlw)}</p></article><article class="card"><span class="leg-number">ZFW</span><div class="perf-value">${kg(m.zfw)}</div><p class="airport-meta">MZFW ${kg(D.limits.mzfw)}</p></article></div><div class="section-title"><h2>Trechos</h2><p>Consumo estimado</p></div><div class="table-wrap"><table><thead><tr><th>#</th><th>Rota/atividade</th><th>Dist.</th><th>TEV</th><th>Fuel</th><th>FL</th></tr></thead><tbody>${rows||'<tr><td colspan="6">Nenhum trecho válido.</td></tr>'}</tbody></table></div><div class="section-title"><h2>Verificações</h2><p>Antes do voo</p></div><div class="warning-list">${warnings(m).map(([c,t])=>`<div class="warning-item ${c}">${t}</div>`).join('')}</div><div class="actions" style="margin-top:14px"><button class="button" id="export-flight-pdf">PDF</button><button class="button secondary" id="reset-all">Limpar planejamento</button></div>`}
    function defaultField(label,key,value,min,max,step=1){return`<div class="field"><label>${label}</label><input type="number" inputmode="decimal" min="${min}" max="${max}" step="${step}" value="${esc(value)}" data-default="${key}"></div>`}function renderDefaults(){const bands=['Até 10 min','De 11 a 19 min','De 20 a 29 min','De 30 a 44 min','De 45 a 59 min','60 min ou mais'];el('page-defaults').innerHTML=`<div class="section-title"><h2>Parâmetros de planejamento</h2><p>Valores editáveis</p></div><article class="card blue"><div class="defaults-grid">${defaultField('Velocidade de cruzeiro (kt)','cruiseKt',defaults.cruiseKt,1,1000)}${defaultField('Consumo da 1ª hora (kg)','firstHourKg',defaults.firstHourKg,0,10000)}${defaultField('Consumo das demais horas (kg/h)','nextHoursKg',defaults.nextHoursKg,0,10000)}${defaultField('Consumo em inspeção (kg/h)','inspectionKgHour',defaults.inspectionKgHour,0,10000)}${defaultField('Acréscimo por trecho (min)','legExtraMinutes',defaults.legExtraMinutes,0,180)}${defaultField('Arredondamento do tempo (min)','roundMinutes',defaults.roundMinutes,1,60)}${defaultField('Reserva (kg)','reserveKg',defaults.reserveKg,0,5962)}${defaultField('Extra fixo (kg)','fixedExtraKg',defaults.fixedExtraKg,0,5962)}</div></article><div class="section-title"><h2>PBO por aeronave</h2><p>Alimenta pesos e performance</p></div><article class="card"><div class="defaults-grid">${Object.keys(D.aircraft).map(registration=>defaultField(`PBO ${registration} (kg)`,`pbo-${registration}`,defaults.aircraftPbo[registration],0,20000)).join('')}</div></article><div class="section-title"><h2>Níveis sugeridos</h2><p>Conforme o tempo do trecho</p></div><article class="card"><div class="defaults-grid">${defaults.levels.map((level,i)=>defaultField(`${bands[i]} · FL`, `level-${i}`,level.fl,0,600)).join('')}</div></article><div class="notice" style="margin-top:12px">Estes parâmetros alimentam os cálculos de rota, inspeção, tempo, consumo, combustível mínimo, níveis sugeridos, PBO, ZFW, TOW, LW, limites de combustível e seleção das faixas de performance. Limites certificados, capacidade de combustível e tabelas de performance não são alterados.</div><div class="actions" style="margin-top:14px"><button class="button secondary" id="reset-defaults">Restaurar padrões originais</button></div>`}
    function applyFuelStyles(m){const insufficient=m.fuel<m.minFuel,weightCard=el('planned-fuel')?.closest('.card'),summaryFuel=el('page-summary').querySelector('.summary-metrics div:last-child'),defaultsCard=el('page-defaults').querySelector('.card');weightCard?.classList.toggle('fuel-danger',insufficient);weightCard?.classList.toggle('blue',!insufficient);summaryFuel?.classList.toggle('fuel-danger',insufficient);defaultsCard?.classList.remove('blue')}

    function flightReportData(){
      const m=model(),fmt=v=>v===null||v===undefined||v===''?'Não informado':String(v),present=v=>v!==null&&v!==undefined&&v!=='';
      const reportAircraft=`Legacy ${state.aircraft}`, reserve=defaults.reserveKg, extra=defaults.fixedExtraKg, payloadRows=[['Cabine FWD',`${state.payload.fwd} × 80 kg`],['Cabine AFT',`${state.payload.aft} × 80 kg`],['Toilet',`${state.payload.toilet} × 80 kg`],['Stowage',kg(state.payload.stowage)],['Cargo',kg(state.payload.cargo)]];
      let accumulated=0;
      const legs=m.legs.slice(0,state.legCount).filter(Boolean).map((leg,index)=>{
        const fuelStart=Math.max(0,m.fuel-accumulated),weightStart=m.zfw+fuelStart;accumulated+=leg.burn;
        return{number:index+1,type:leg.type==='inspection'?'Inspeção em voo':'Rota',route:leg.type==='inspection'?`INSPEÇÃO • ${leg.a.icao}`:`${leg.a.icao} → ${leg.b.icao}`,airports:leg.type==='inspection'?leg.a.name:`${leg.a.name} → ${leg.b.name}`,distance:leg.type==='inspection'?'—':nm(leg.dist),time:minText(leg.minutes),level:leg.fl,burn:kg(leg.burn),fuelStart:kg(fuelStart),fuelEnd:kg(Math.max(0,fuelStart-leg.burn)),weightStart:kg(weightStart),weightEnd:kg(weightStart-leg.burn),zfw:kg(m.zfw),note:leg.type==='inspection'?`Tempo de inspeção: ${minText(leg.minutes)}`:''}
      });
      const alt=m.alt?{number:'ALT',type:'Alternativa',route:`${m.alt.a.icao} → ${m.alt.b.icao}`,airports:`${m.alt.a.name} → ${m.alt.b.name}`,distance:nm(m.alt.dist),time:minText(m.alt.minutes),level:m.alt.fl,burn:kg(m.alt.burn),fuelStart:kg(Math.max(0,m.fuel-m.mainBurn)),fuelEnd:kg(Math.max(0,m.fuel-m.mainBurn-m.alt.burn)),weightStart:kg(m.zfw+Math.max(0,m.fuel-m.mainBurn)),weightEnd:kg(m.zfw+Math.max(0,m.fuel-m.mainBurn-m.alt.burn)),zfw:kg(m.zfw),note:''}:{number:'ALT',type:'Alternativa não definida',route:'—',airports:'Informe o aeródromo alternativo',distance:'—',time:'—',level:'—',burn:'—',fuelStart:'—',fuelEnd:'—',weightStart:'—',weightEnd:'—',zfw:kg(m.zfw),note:'Não há trecho de alternativa calculado.'};
      const weather=[];
      for(const [role,label,airport,weight,kind] of [['adep','ADEP',m.adep,m.tow,'takeoff'],['adest','ADEST',m.adest,m.tow-m.mainBurn,'landing'],['altn','ALTN',m.alt?.b,m.tow-m.mainBurn-m.altBurn,'landing']]){
        if(!airport)continue;const wx=state.weather[role],runway=resolveRunway(airport,wx),component=runway?windComponent(wx.windDir,wx.windSpeed,runway.heading):null;
        const detail=(()=>{const flap=kind==='takeoff'?(wx.flap==='1'?'1':'2'):(wx.flap==='3'?'3':'FULL'),ice=wx.iceProtection==='ALL'?'ALL':'OFF',surface=wx.runwaySurface==='WET'?'WET':'DRY',perf=kind==='takeoff'?takeoffPerf(airport.elev,num(wx.temp),weight,flap,ice):landingPerf(airport.elev,component??0,weight,flap,ice,surface),margin=perf?(runway?.length||airport.runway||0)-perf.distance:null;return{conditions:`Temperatura ${present(wx.temp)?wx.temp+' °C':'não informada'} · vento ${present(wx.windDir)&&present(wx.windSpeed)?wx.windDir+'° / '+wx.windSpeed+' kt':'não informado'} · flap ${flap} · ice ${ice}${kind==='landing'?' · pista '+(surface==='WET'?'molhada':'seca'):''}`,performance:perf?`${Math.round(perf.distance)} m requeridos · margem ${Math.round(margin)} m${kind==='takeoff'?` · V1 ${perf.v1} / VR ${perf.vr} / V2 ${perf.v2} kt`:''}`:'Indisponível para os dados informados'}})();
        weather.push({label,icao:airport.icao,airport:`${airport.name} · elevação ${airport.elev} ft`,conditions:detail.conditions,runway:runway?`${runway.id} · ${runwayHeadingText(runway)} · ${runway.length||airport.runway||0} m · ${component===null?'componente não calculada':Math.abs(component).toFixed(1)+' kt '+(component>=0?'PROA':'CAUDA')}`:'Cabeceira não disponível',performance:detail.performance,metar:fmt(wx.metar),taf:fmt(wx.taf)});
      }
      return{aircraft:reportAircraft,totals:{route:legs.length?legs.map(l=>l.route).join('  •  '):'Rota não definida',metrics:[['Distância total',nm(m.totalDistance)],['Tempo total',minText(m.totalMinutes)],['Consumo total',kg(m.mainBurn+m.altBurn)],['Fuel mínimo',kg(m.minFuel)],['Fuel planejado',kg(m.fuel)],['Fuel máximo',kg(m.maxFuel)],['ZFW',kg(m.zfw)],['TOW',kg(m.tow)],['LW final',kg(m.lw)]],weights:[['PBO',kg(m.pbo)],['Payload total',kg(m.payload)],['ZFW',`${kg(m.zfw)} / limite ${kg(D.limits.mzfw)}`],['TOW',`${kg(m.tow)} / MTOW ${kg(D.limits.mtow)}`],['LW no destino',`${kg(m.lw)} / MLW ${kg(D.limits.mlw)}`],['Reserva',kg(reserve)],['Extra fixo',extra?kg(extra):'Não aplicável']] },legs,alternate:alt,weather,checks:warnings(m).map(([,message],i)=>[`Verificação ${i+1}`,message])};
    }

    function render(){const m=model();renderRoute(m);renderWeight(m);renderPerformance(m);renderSummary(m);renderDefaults();applyFuelStyles(m);bind();showPage(state.page,false);save()}
    function bind(){document.querySelectorAll('[data-leg]').forEach(x=>x.addEventListener('change',()=>{const i=+x.dataset.leg,side=x.dataset.side;x.value=x.value.trim().toUpperCase();state.legs[i][side]=x.value;if(i<4){const next=state.legs[i+1],nextOrigin=state.legs[i].type==='inspection'?state.legs[i].from:state.legs[i].to;if(nextOrigin&&!next.from)next.from=nextOrigin}render()}));document.querySelectorAll('[data-leg-type]').forEach(x=>x.addEventListener('click',()=>{const i=+x.dataset.legType,leg=state.legs[i],wasDestination=leg.to;leg.type=x.dataset.type==='inspection'?'inspection':'route';if(leg.type==='inspection'){if(wasDestination&&i>0&&!leg.from)leg.from=wasDestination;leg.to=''}if(i<4&&!state.legs[i+1].from){const nextOrigin=leg.type==='inspection'?leg.from:leg.to;if(nextOrigin)state.legs[i+1].from=nextOrigin}render()}));document.querySelectorAll('[data-inspection-minutes]').forEach(x=>x.addEventListener('change',()=>{const i=+x.dataset.inspectionMinutes;state.legs[i].inspectionMinutes=Math.max(0,num(x.value));render()}));el('add-leg')?.addEventListener('click',()=>{if(state.legCount<5){const previous=state.legs[state.legCount-1],next=state.legs[state.legCount],nextOrigin=previous.type==='inspection'?previous.from:previous.to;if(nextOrigin&&!next.from)next.from=nextOrigin;state.legCount++;render()}});el('remove-leg')?.addEventListener('click',()=>{if(state.legCount>1){state.legs[state.legCount-1]=emptyLeg();state.legCount--;render()}});el('alternate')?.addEventListener('change',e=>{state.alternate=e.target.value.trim().toUpperCase();render()});document.querySelectorAll('[data-aircraft]').forEach(x=>x.addEventListener('click',()=>{state.aircraft=x.dataset.aircraft;render()}));document.querySelectorAll('[data-payload]').forEach(x=>x.addEventListener('change',()=>{const k=x.dataset.payload,max=x.max?+x.max:1e9;state.payload[k]=clamp(num(x.value),0,max);render()}));el('planned-fuel')?.addEventListener('change',e=>{state.fuel=clamp(num(e.target.value),0,D.limits.fuelCapacity);render()});el('use-min')?.addEventListener('click',()=>{state.fuel=Math.min(D.limits.fuelCapacity,Math.ceil(model().minFuel/10)*10);render()});document.querySelectorAll('[data-wx]').forEach(x=>x.addEventListener('change',()=>{const role=x.dataset.wx,field=x.dataset.wxfield;state.weather[role][field]=field==='windDir'&&x.value!==''?clamp(num(x.value),0,360):field==='windSpeed'&&x.value!==''?Math.max(0,num(x.value)):x.value;render()}));document.querySelectorAll('[data-default]').forEach(x=>x.addEventListener('change',()=>{const min=Number(x.min),max=Number(x.max),value=clamp(num(x.value),min,max),key=x.dataset.default;if(key.startsWith('level-'))defaults.levels[Number(key.slice(6))].fl=Math.round(value);else if(key.startsWith('pbo-'))defaults.aircraftPbo[key.slice(4)]=Math.round(value);else defaults[key]=value;render()}));el('reset-defaults')?.addEventListener('click',()=>{if(confirm('Restaurar todos os parâmetros originais de planejamento?')){defaults=factoryDefaults();render()}});el('update-weather')?.addEventListener('click',updateWeather);el('export-flight-pdf')?.addEventListener('click',async()=>{const button=el('export-flight-pdf');button.disabled=true;try{await window.IVFlightReport.exportReport(flightReportData())}catch(error){console.error(error);alert('Não foi possível gerar o PDF neste dispositivo.')}finally{button.disabled=false}});el('reset-all')?.addEventListener('click',()=>{if(confirm('Limpar todos os dados deste planejamento?')){state=fresh();render()}})}
    function showPage(name,scroll=true){state.page=name;document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===`page-${name}`));document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.page===name));save();if(scroll)window.scrollTo({top:0,behavior:'smooth'})}document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>showPage(t.dataset.page)));el('aerodrome-list').innerHTML=allAerodromes.map(a=>`<option value="${a[0]}">${esc(a[1])} · ${a[6]||''}</option>`).join('');
    async function latestWx(icao,type){const response=await fetch(`https://api.met.no/weatherapi/tafmetar/1.0/${type}.txt?icao=${encodeURIComponent(icao)}`);if(!response.ok)return'';const lines=(await response.text()).split(/\r?\n/).map(x=>x.trim()).filter(Boolean);return type==='taf'?lines.join(' '):(lines.at(-1)||'')}async function updateWeather(){const m=model(),stations={adep:m.adep?.icao,adest:m.adest?.icao,altn:m.alt?.b?.icao},entries=Object.entries(stations).filter(([,id])=>id);if(!entries.length){alert('Defina a rota antes de atualizar a meteorologia.');return}const status=el('weather-status');status.textContent='Consultando METAR e TAF…';try{let received=0;await Promise.all(entries.map(async([role,id])=>{const[metar,taf]=await Promise.all([latestWx(id,'metar').catch(()=>''),latestWx(id,'taf').catch(()=>'')]);if(metar){state.weather[role].metar=metar;received++;const temperature=metar.match(/\s(M?\d{2})\/(?:M?\d{2}|XX)\s/),wind=metar.match(/\b(\d{3}|VRB)(\d{2,3})(?:G\d{2,3})?KT\b/);if(temperature)state.weather[role].temp=(temperature[1][0]==='M'?-1:1)*Number(temperature[1].replace('M',''));if(wind){state.weather[role].windDir=wind[1]==='VRB'?'':Number(wind[1]);state.weather[role].windSpeed=Number(wind[2]);state.weather[role].runway='AUTO'}}if(taf){state.weather[role].taf=taf;received++}}));if(!received)throw new Error('Nenhum boletim recebido');render();el('weather-status').textContent='Meteorologia atualizada. Confira os boletins e valores antes de usar.'}catch(err){status.textContent='Não foi possível consultar agora. Verifique a conexão ou use temperatura e vento manualmente.'}}
    ['gesturestart','gesturechange','gestureend'].forEach(type=>document.addEventListener(type,event=>event.preventDefault(),{passive:false}));
    render();
  })();
  </script>
