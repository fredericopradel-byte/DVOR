:root{color-scheme:dark;--bg:#17191b;--line:#4d5359;--muted:#aeb5bc;--blue:#0aa4ef;--shadow:0 16px 35px rgba(0,0,0,.24)}*{box-sizing:border-box}html,body{touch-action:pan-x pan-y}body{margin:0;min-height:100svh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 100% 0,#44494d 0,transparent 30%),linear-gradient(155deg,#151719,#292c2f);color:#fff}.shell{width:min(760px,100%);min-height:100svh;margin:auto;padding:max(18px,env(safe-area-inset-top)) 18px max(30px,env(safe-area-inset-bottom))}.topbar{display:flex;align-items:center;gap:13px;margin-bottom:42px}.back{width:44px;height:44px;border:1px solid var(--line);border-radius:14px;display:grid;place-items:center;text-decoration:none;color:var(--blue);font-size:32px;background:rgba(255,255,255,.04)}.brand small{display:block;color:var(--blue);font-weight:800;letter-spacing:.12em}.brand strong{font-size:1.2rem}.intro{margin:0 4px 22px}.intro h1{margin:0 0 8px;font-size:clamp(2rem,7vw,3rem);line-height:1.05}.intro p{margin:0;color:var(--muted);line-height:1.45}.cards{display:grid;gap:14px}.card{display:flex;align-items:center;gap:16px;min-height:118px;padding:18px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.035));color:#fff;text-decoration:none;box-shadow:var(--shadow);-webkit-tap-highlight-color:transparent}.card:active{transform:scale(.985)}.icon{width:54px;height:54px;flex:0 0 auto;border:1px solid rgba(255,255,255,.12);border-radius:16px;background:#1c1f21;color:var(--blue);display:grid;place-items:center}.icon svg{width:36px;height:36px}.copy{flex:1}.copy strong{display:block;font-size:1.1rem;margin-bottom:5px}.copy span{display:block;color:var(--muted);font-size:.86rem;line-height:1.4}.arrow{font-size:1.6rem;color:var(--blue)}@media(min-width:620px){.cards{grid-template-columns:1fr 1fr}.card{min-height:170px;align-items:flex-start;position:relative}.arrow{position:absolute;right:20px;bottom:18px}}
