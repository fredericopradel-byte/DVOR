<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#17191b"><title>Procedimentos cadastrados · IV-PLANNER</title><link rel="manifest" href="../manifest.webmanifest"><script src="../global-nav.js?v=20260922-1" defer></script><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#17191b;color:#f5f7f9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:pan-x pan-y}.shell{max-width:900px;margin:auto;padding:max(16px,env(safe-area-inset-top)) 14px max(24px,env(safe-area-inset-bottom))}header{display:flex;gap:14px;align-items:center;margin-bottom:24px}a,button{color:inherit;font:inherit;min-height:44px;touch-action:manipulation}.back{display:grid;place-items:center;width:44px;border:1px solid #4d5359;border-radius:12px;text-decoration:none;font-size:28px;color:#0aa4ef}small,p{color:#aeb5bc;line-height:1.5}header small{display:block;color:#0aa4ef;font-weight:800}h1{font-size:24px;margin:0}.card{border:1px solid #4d5359;border-radius:16px;padding:16px;margin:12px 0;background:linear-gradient(145deg,#30363b,#23282c)}h2{font-size:18px;margin:0;overflow-wrap:anywhere}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions a,.actions button{padding:10px 14px;background:#25292d;border:1px solid #4d5359;border-radius:10px;text-decoration:none}.actions a{background:#078dd1}.actions button{cursor:pointer}.danger{color:#ff9c9c}input{font:inherit;font-size:16px;padding:12px;background:#181c20;border:1px solid #4d5359;border-radius:10px;color:white;width:100%;min-height:44px}label{display:grid;gap:7px;color:#aeb5bc;font-size:13px}.warning{color:#ffb64d}.empty{padding:20px 0}
</style></head><body><main class="shell"><header><a class="back" href="index.html" aria-label="Voltar">‹</a><div><small>IV-PLANNER · LOCALIDADES E AUXÍLIOS</small><h1>Procedimentos cadastrados</h1></div></header><p>Desenhos, referências e restrições salvos na Missão de NDB e Procedimentos. Abrir um cadastro prepara uma nova missão a partir dele.</p><label>Buscar por nome, ICAO ou local<input id="search" type="search" placeholder="Buscar procedimento"></label><div id="list" aria-live="polite"></div></main><script>
(()=>{'use strict';const KEY='ivplanner-custom-procedures-v1',list=document.getElementById('list'),search=document.getElementById('search');function read(){const value=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(value))throw Error('Cadastro não reconhecido. Os dados existentes foram preservados.');return value}function node(tag,cls,text,parent){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;if(parent)parent.append(n);return n}function render(){list.replaceChildren();try{const term=search.value.toLocaleLowerCase('pt-BR'),rows=read().filter(r=>[r.title,r.icao,r.local,r.module,r.kind].join(' ').toLocaleLowerCase('pt-BR').includes(term));if(!rows.length){node('p','empty','Nenhum procedimento cadastrado para esta busca.',list);return}for(const r of rows){const card=node('article','card',undefined,list);node('h2','',r.title||'Sem identificação',card);node('p','',[r.module==='ndb'?'NDB':'Procedimentos',r.kind,r.icao,r.local].filter(Boolean).join(' · '),card);const actions=node('div','actions',undefined,card),a=node('a','','Abrir',actions);a.href='../inspecao/desenhar.html?modulo='+(r.module==='ndb'?'ndb':'procedimentos')+'&procedimento='+encodeURIComponent(r.id);const exp=node('button','','Exportar JSON',actions);exp.onclick=()=>{const blob=new Blob([JSON.stringify(r.document,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='IV-PLANNER-procedimento.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),5000)};const del=node('button','danger','Excluir cadastro',actions);del.onclick=()=>{if(!confirm('Excluir '+(r.title||'este procedimento')+' da base? Missões e rascunhos serão preservados.'))return;try{localStorage.setItem(KEY,JSON.stringify(read().filter(x=>x.id!==r.id)));render()}catch(e){alert(e.message)}}}}catch(e){node('p','warning',e.message||'Não foi possível ler os cadastros. Os dados existentes foram preservados.',list)}}search.oninput=render;window.addEventListener('storage',render);render();['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));if('serviceWorker'in navigator)navigator.serviceWorker.register('../sw.js').catch(()=>{});
})();</script></body></html>
