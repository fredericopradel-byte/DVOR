<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#17191b">

  <title>Inspeção em Voo · IV-PLANNER</title>
  <style>
    :root{color-scheme:dark;--bg:#17191b;--panel:#24272a;--line:#4d5359;--text:#f5f7f9;--muted:#aeb5bc;--blue:#078dd1;--blue2:#0aa4ef;--shadow:0 16px 35px rgba(0,0,0,.24)}
    *{box-sizing:border-box}body{margin:0;min-height:100svh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 100% 0,#44494d 0,transparent 30%),linear-gradient(155deg,#151719,#292c2f);color:var(--text)}main{width:min(820px,100%);min-height:100svh;margin:auto;padding:max(18px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom))}.topbar{display:flex;align-items:center;gap:14px;margin-bottom:34px}.back{display:grid;place-items:center;width:42px;height:42px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.05);color:#fff;text-decoration:none;font-size:1.7rem}.brand small{display:block;color:var(--blue2);font-size:.68rem;font-weight:800;letter-spacing:.16em}.brand strong{display:block;font-size:1.18rem;font-style:italic;letter-spacing:-.03em}.header{margin:0 2px 25px}.header h1{font-size:clamp(1.9rem,7vw,2.7rem);margin:0 0 7px}.header p{margin:0;color:var(--muted)}
    .grid{display:grid;gap:12px}.card{display:flex;align-items:center;gap:14px;min-height:92px;padding:15px 16px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.035));box-shadow:var(--shadow);color:#fff;text-decoration:none;-webkit-tap-highlight-color:transparent;transition:transform .16s,border-color .16s}.card:active{transform:scale(.985)}.card.available{border-color:rgba(10,164,239,.6);background:linear-gradient(145deg,rgba(7,141,209,.2),rgba(255,255,255,.035))}.icon{width:51px;height:51px;flex:0 0 auto;display:grid;place-items:center;border:1px solid rgba(255,255,255,.12);border-radius:16px;background:#1c1f21;color:var(--blue2)}.icon svg{width:32px;height:32px;stroke:currentColor}.copy{min-width:0;flex:1}.copy strong{display:block;font-size:1.04rem}.copy span{display:block;color:var(--muted);font-size:.76rem;margin-top:4px}.status{font-size:.62rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.available .status{color:var(--blue2)}.arrow{font-size:1.45rem;color:var(--blue2)}
    @media(min-width:620px){.grid{grid-template-columns:1fr 1fr}.card{min-height:118px}.card.available{grid-column:span 2}}
  </style>
</head>
<body><main>
  <div class="topbar"><a class="back" href="../" aria-label="Voltar ao menu inicial">‹</a><div class="brand"><small>IV-PLANNER</small><strong>INSPEÇÃO EM VOO</strong></div></div>

    <a class="card" href="ils.html"><span class="icon" aria-hidden="true"><svg viewBox="0 0 36 36" fill="none" stroke-width="2.2" stroke-linecap="round"><path d="M8 31l5-26h10l5 26M11 24h14M13 16h10M18 5v26"/><path d="M4 9l5 3M32 9l-5 3"/></svg></span><span class="copy"><strong>ILS</strong><span>Localizer e glide slope</span></span><span class="status">Em breve</span><span class="arrow">›</span></a>
    <a class="card" href="radar.html"><span class="icon" aria-hidden="true"><svg viewBox="0 0 36 36" fill="none" stroke-width="2.2" stroke-linecap="round"><circle cx="18" cy="18" r="13"/><path d="M18 18l9-8M8 25a13 13 0 0 1 18-16M18 18l-7 9"/><circle cx="18" cy="18" r="2" fill="currentColor" stroke="none"/></svg></span><span class="copy"><strong>Radar</strong><span>Cobertura e vigilância</span></span><span class="status">Em breve</span><span class="arrow">›</span></a>
    <a class="card" href="par.html"><span class="icon" aria-hidden="true"><svg viewBox="0 0 36 36" fill="none" stroke-width="2.2" stroke-linecap="round"><path d="M7 28h22M18 28V17M13 31h10M18 17l11-8M18 17L7 9"/><path d="M10 7a14 14 0 0 1 16 0M13 11a9 9 0 0 1 10 0"/></svg></span><span class="copy"><strong>PAR</strong><span>Aproximação de precisão</span></span><span class="status">Em breve</span><span class="arrow">›</span></a>
  </nav>
</main><script>['gesturestart','gesturechange','gestureend'].forEach(type=>document.addEventListener(type,event=>event.preventDefault(),{passive:false}));</script></body></html>
