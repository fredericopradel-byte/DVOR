<!doctype html>
<html lang="pt-BR">
<head>

  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

  <title>IV-PLANNER</title>
  <link rel="icon" type="image/png" href="icon-512.png">
  <style>
    :root{color-scheme:dark;--ink:#17191b;--silver:#d9dde1;--brand-blue:#0785c8;--line:rgba(255,255,255,.16);--muted:#adb3b9}
    *{box-sizing:border-box} body{margin:0;min-height:100svh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 82% 0,#4a4e52 0,transparent 34%),linear-gradient(160deg,#151719,#292c2f 62%,#111315);color:#fff}
    main{width:min(760px,100%);min-height:100svh;margin:auto;padding:max(34px,env(safe-area-inset-top)) 20px max(28px,env(safe-area-inset-bottom));display:flex;flex-direction:column}
    .brand{display:flex;align-items:center;gap:12px;margin:8px 4px 46px}.mark{width:67px;height:67px;display:grid;place-items:center;filter:drop-shadow(0 7px 15px rgba(0,0,0,.3))}.mark svg{width:67px;height:67px;display:block}.wordmark{font-family:Impact,"Arial Black","Helvetica Neue",sans-serif;font-size:clamp(1.45rem,5.5vw,2rem);font-style:italic;font-weight:900;letter-spacing:-.045em;line-height:.9;transform:skewX(-4deg);color:#f6f7f8;text-shadow:0 2px 0 #777d82,0 4px 9px rgba(0,0,0,.55);white-space:nowrap}
    .intro{margin:0 4px 24px}.intro h2{font-size:clamp(1.75rem,6vw,2.6rem);line-height:1.05;margin:0 0 10px}.intro p{margin:0;color:var(--muted);font-size:1rem}
    nav{display:grid;gap:14px}.card{display:flex;align-items:center;gap:17px;min-height:106px;padding:20px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(135deg,rgba(255,255,255,.105),rgba(255,255,255,.045));color:#fff;text-decoration:none;box-shadow:0 16px 38px rgba(0,0,0,.2);transition:transform .16s ease,border-color .16s ease,background .16s ease;-webkit-tap-highlight-color:transparent}.card:active{transform:scale(.985);background:rgba(255,255,255,.13)}.icon{width:54px;height:54px;flex:0 0 auto;border-radius:17px;background:#f3f4f5;color:var(--ink);display:grid;place-items:center;font-size:27px}.icon svg{width:38px;height:38px;display:block}.copy{flex:1}.copy strong{display:block;font-size:1.13rem;margin-bottom:5px}.copy span{display:block;color:var(--muted);font-size:.9rem;line-height:1.35}.arrow{font-size:1.65rem;color:var(--brand-blue)}
    footer{margin-top:auto;padding-top:32px;text-align:center;color:#8f969c;font-size:.75rem;letter-spacing:.08em}
    @media(min-width:620px){nav{grid-template-columns:1fr 1fr}.card{min-height:160px;align-items:flex-start;position:relative}.arrow{position:absolute;right:20px;bottom:18px}}
  </style>
</head>
<body><main>
  <header class="brand"><div class="mark" aria-hidden="true"><svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="35" fill="#24272a" stroke="#f4f5f6" stroke-width="3"/><circle cx="40" cy="40" r="18" fill="none" stroke="#cdd1d4" stroke-width="2.4"/><path d="M40 5v22M40 53v22M5 40h22M53 40h22M15 15l16 16M49 49l16 16M65 15L49 31M31 49L15 65" fill="none" stroke="#cdd1d4" stroke-width="2.4"/><path d="M5 40L38 29 69 10 50 34 47 40 50 46l19 24-31-19z" fill="#f7f8f9" stroke="#e1e4e6" stroke-width="1" stroke-linejoin="round"/><path d="M51 31l13-15-9 16zM51 49l13 15-9-16z" fill="#24272a"/></svg></div><div class="wordmark">IV‑PLANNER</div></header>
  <section class="intro"><h2>Ferramentas de voo</h2><p>Selecione uma área operacional.</p></section>
  <nav aria-label="Menu principal">

</main></body></html>
