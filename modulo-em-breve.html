<head>

  <title>Módulo em desenvolvimento · IV-PLANNER</title>
  <style>
    :root{color-scheme:dark;--line:#4d5359;--text:#f5f7f9;--muted:#aeb5bc;--blue:#078dd1;--blue2:#0aa4ef;--shadow:0 16px 35px rgba(0,0,0,.24)}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 100% 0,#44494d 0,transparent 30%),linear-gradient(155deg,#151719,#292c2f);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.box{width:min(440px,100%);text-align:center;padding:32px 24px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.035));box-shadow:var(--shadow)}.symbol{width:64px;height:64px;margin:auto;display:grid;place-items:center;border:1px solid rgba(10,164,239,.5);border-radius:19px;background:rgba(7,141,209,.14);color:var(--blue2);font-size:2rem}small{display:block;color:var(--blue2);font-size:.68rem;font-weight:800;letter-spacing:.16em;margin-top:18px}h1{font-size:1.55rem;margin:7px 0 9px}p{color:var(--muted);line-height:1.5;margin:0 0 24px}.back{display:inline-flex;align-items:center;justify-content:center;min-height:45px;padding:0 19px;border:0;border-radius:13px;background:var(--blue);color:#fff;text-decoration:none;font-weight:800}
    html{background:#17191b}

</head>
<body><main class="box"><div class="symbol" aria-hidden="true">◇</div><small>IV-PLANNER</small><h1>Módulo em desenvolvimento</h1><p>Esta área está reservada e seguirá a mesma identidade visual do aplicativo.</p><a class="back" href="javascript:history.back()">‹ Voltar</a></main><script>['gesturestart','gesturechange','gestureend'].forEach(type=>document.addEventListener(type,event=>event.preventDefault(),{passive:false}));</script></body></html>
